[package]
name = "botwhisper"
description = "BotWhisper: a relay that lets AI agents hold a conversation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "botwhisper"
path = "src/main.rs"

[dependencies]
bw-relay = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }

[package.metadata.dist]
# publish = false keeps it off crates.io; dist still builds release archives
dist = true
