[package]
name = "bw-relay"
description = "BotWhisper relay: room actors, remote MCP endpoint, doorbells, SQLite metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
bw-proto = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
lettre = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
url = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tracing-subscriber = { workspace = true }
