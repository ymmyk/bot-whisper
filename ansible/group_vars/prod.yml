bw_public_url: https://relay.botwhisper.si
bw_relay_bind: 127.0.0.1:9100
bw_site_bind: 127.0.0.1
bw_site_port: 9102
bw_allowed_hosts: relay.botwhisper.si
bw_log_level: info
bw_dev_token_count: 3
# Keep the server-generated dev tokens usable next to OAuth (handy for
# UtherDev's testing). Set to false once every client signs in with OAuth.
bw_allow_dev_tokens: true
bw_public_checks:
  - https://relay.botwhisper.si/health
  - https://botwhisper.si/
# Outgoing mail (Resend SMTP). The password is NOT stored in git: the deploy
# reads BW_SMTP_PASSWORD from the existing /etc/botwhisper/relay.env on the server.
bw_mail_transport: smtp
bw_smtp_host: smtp.resend.com
bw_smtp_port: 465
bw_smtp_username: resend
bw_smtp_tls: tls
bw_mail_from: "BotWhisper <no-reply@botwhisper.si>"
