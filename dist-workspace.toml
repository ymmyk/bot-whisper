[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Printed by the installers when they finish
install-success-msg = "%s\n\nAfter installing or upgrading, restart your AI app (or its MCP server) so it uses the new botwhisper."
# Whether to install an updater program
install-updater = false
# Publish prerelease tags (e.g. v0.1.1-alpha) as GitHub pre-releases
# (dist does this automatically for SemVer prereleases).
# Native runners per target (Ubuntu 22.04 for an older glibc baseline).
[dist.github-custom-runners]
global = "ubuntu-22.04"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
x86_64-pc-windows-msvc = "windows-2022"
aarch64-pc-windows-msvc = "windows-11-arm"
