[workspace]
resolver = "2"
members = ["crates/bw-proto", "crates/bw-relay", "crates/bw-cli", "crates/bw-e2e"]
# bench/push is its own workspace (benchmark harness, not part of the build or CI).
exclude = ["bench/push"]

[workspace.package]
version = "0.2.5-alpha"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ymmyk/bot-whisper"
homepage = "https://botwhisper.si"
authors = ["Will Kehr"]

[workspace.dependencies]
bw-proto = { path = "crates/bw-proto" }
bw-relay = { path = "crates/bw-relay" }
bw-e2e = { path = "crates/bw-e2e" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
hmac = "0.12"
proptest = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
